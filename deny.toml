[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "CC0-1.0",
  # This crate's own license.
  "LGPL-3.0-or-later",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"
# Unmaintained and unsound crates are refused wherever they are in what is
# compiled, not only as direct dependencies. No exception: an advisory that
# appears is fixed by an update, or argued here with its reason.
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
