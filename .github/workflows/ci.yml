name: CI

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
    branches: [main, "dev/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: brig-id/.github/.github/workflows/ci-rust.yml@main

  # The core's tests and the servers built with this change, and their suites
  # (brig-id/.github, integration.yml). A branch of the same name with an open
  # pull request in another repository is taken instead of its main.
  integration:
    uses: brig-id/.github/.github/workflows/integration.yml@main
    with:
      heads: true
